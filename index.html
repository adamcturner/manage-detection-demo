<title>Manage Detection Demo</title>
<style>
  :root{--card:#0A2E57;--stroke:rgba(160,199,255,.24);--weak:#C6CBCB;--brand:#007D93;--brand-h:#09A8B8;--danger:#FF5664}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;color:#fff;
    font-family:'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:#04122E radial-gradient(circle at 30% 20%,#0a3a7a,#04122E 70%)}
  form{width:min(380px,100%);background:var(--card);border:1px solid var(--stroke);border-radius:12px;padding:28px;
    display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
  h1{font-size:18px;font-weight:600}
  p{font-size:13px;color:var(--weak);margin-bottom:4px}
  label{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.8)}
  input{height:38px;border-radius:6px;border:1px solid var(--stroke);background:rgba(4,18,46,.5);color:#fff;padding:0 12px;font:inherit;font-size:14px}
  input:focus{outline:2px solid #2FCAFF;outline-offset:1px}
  button{height:38px;border:none;border-radius:6px;background:var(--brand);color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px}
  button:hover{background:var(--brand-h)}
  button:disabled{opacity:.6;cursor:progress}
  .err{color:var(--danger);font-size:12.5px;min-height:18px}
</style>
</head>

</form>
